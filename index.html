<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동탄하나교회 · 썸네일 아카이브</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#0b3335;
    --bg2:#0a2c2e;
    --surface:#123f41;
    --surface-hover:#164a4d;
    --border:rgba(255,255,255,0.08);
    --text:#eef7f6;
    --text-dim:#9dc4c2;
    --accent:#f2e04d;
    --accent-teal:#2a8f8a;
    --ok:#6fcf97;
    --wip:#f2c94c;
    --todo:#8a9ba0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    color:var(--text);
    min-height:100vh;
    padding-bottom:40px;
  }

  header{
    padding:28px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  header .church-logo{
    height:30px;
    width:auto;
    display:block;
    margin:0 auto;
  }
  header .eyebrow{
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  header h1{
    margin:14px 0 0;
    font-size:22px;
    font-weight:800;
    position:relative;
    display:inline-block;
  }
  header h1 .hl{
    position:relative;
    z-index:1;
    color:var(--text);
  }
  header h1 .hl::before{
    content:"";
    position:absolute;
    left:-4px; right:-4px; bottom:-3px; height:24%;
    background:var(--accent);
    z-index:-1;
    transform:skewX(-6deg) rotate(-0.6deg);
    opacity:0.9;
  }

  .toolbar{
    max-width:720px;
    margin:20px auto 0;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .search-row{
    display:flex;
    gap:8px;
  }
  input[type="text"], select{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 14px;
    font-size:14px;
    outline:none;
  }
  input[type="text"]{ flex:1; }
  input[type="text"]::placeholder{ color:var(--text-dim); }
  input[type="text"]:focus, select:focus{ border-color:var(--accent-teal); }
  .filter-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-row select{ flex:1; min-width:110px; }

  .count-bar{
    max-width:720px;
    margin:14px auto 0;
    padding:0 16px;
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
  }

  .list{
    max-width:720px;
    margin:16px auto 0;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:background 0.15s ease;
  }
  .card:hover{ background:var(--surface-hover); }

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px;
    background:rgba(0,0,0,0.15);
  }
  .card-top .no{
    font-size:12px;
    font-weight:700;
    color:var(--text-dim);
  }

  .dl-group{
    display:flex;
    gap:6px;
  }
  .dl-icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    padding:0;
    border-radius:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border);
  }
  .dl-icon-btn:hover{ background:rgba(255,255,255,0.14); }
  .dl-icon-btn img{
    width:18px;
    height:18px;
    object-fit:contain;
    display:block;
  }

  .thumbs-row{
    display:flex;
    align-items:stretch;
    gap:2px;
    padding:0;
    background:var(--border);
  }
  .thumb-col{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .thumb-caption{
    font-size:10.5px;
    font-weight:700;
    color:var(--text-dim);
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:8px 4px 0;
  }
  .thumbs-row .thumb{
    position:relative;
    width:100%;
    height:150px;
    background:#0a1f20;
    overflow:hidden;
    cursor:pointer;
  }
  .thumbs-row .thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .thumbs-row .thumb .noimg{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-size:9px;
    text-align:center;
    padding:2px;
  }
  .thumbs-row .thumb .ratio-label{
    position:absolute;
    left:3px;
    bottom:3px;
    font-size:9px;
    color:var(--text);
    background:rgba(0,0,0,0.55);
    padding:1px 4px;
    border-radius:4px;
    line-height:1.4;
  }

  .card .body{
    flex:1;
    padding:10px 12px;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card .meta-line{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--text-dim);
    flex-wrap:wrap;
  }
  .tag{
    background:rgba(255,255,255,0.08);
    padding:2px 7px;
    border-radius:99px;
    font-size:11px;
    white-space:nowrap;
  }
  .status{
    padding:2px 8px;
    border-radius:99px;
    font-size:11px;
    font-weight:700;
    color:#0b2323;
    white-space:nowrap;
  }
  .status.done{ background:var(--ok); }
  .status.wip{ background:var(--wip); }
  .status.todo{ background:var(--todo); color:#fff; }

  .card .title{
    font-size:14.5px;
    font-weight:700;
    line-height:1.35;
    word-break:keep-all;
  }

  .card .links{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:2px;
  }
  .card .links a{
    font-size:11px;
    color:var(--accent);
    text-decoration:none;
    background:rgba(242,224,77,0.1);
    padding:3px 8px;
    border-radius:8px;
    border:1px solid rgba(242,224,77,0.25);
  }
  .card .links a:hover{ text-decoration:underline; }

  .card .version{
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .card .note{
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:4px;
    padding-top:6px;
    border-top:1px dashed var(--border);
    line-height:1.5;
    white-space:pre-wrap;
  }

  .empty, .error{
    max-width:720px;
    margin:40px auto;
    padding:24px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    line-height:1.6;
  }
  .error code{
    display:block;
    margin-top:10px;
    background:rgba(0,0,0,0.25);
    padding:10px;
    border-radius:8px;
    font-size:11px;
    color:var(--accent);
    word-break:break-all;
  }

  @media (min-width:560px){
    .filter-row select{ flex:0 0 auto; min-width:140px; }
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(3,15,16,0.92);
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:200;
    cursor:zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:100%;
    max-height:100%;
    border-radius:10px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
</style>
</head>

<script>
/* ============================================================
   설정: 폼 종류마다 구글시트 "탭"이 따로 있고, 그 탭을 각각
   "웹에 게시(CSV)"해서 나온 주소를 아래에 하나씩 채워 넣으세요.

   시트 만드는 법 (탭 하나당 반복):
   1) 구글시트에서 해당 폼종류 이름으로 탭 생성
   2) 파일 > 공유 > 웹에 게시 > 시트 선택(그 탭) > 쉼표로 구분된 값(.csv) > 게시
   3) 나온 URL을 아래 같은 이름의 " " 안에 붙여넣기

   URL을 비워두면(""), 그 폼종류를 선택했을 때 샘플 데이터로
   미리보기가 뜹니다 (시트 연결 전 테스트용).
   ============================================================ */
const SHEET_URLS = {

  "글숏폼":              "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEjSJ3Of6V82_BFanugtMzXGxPJ_2KyGjKy8FxC_y8HhhmWsDpCpsG4vaCCAOtIi4lKc6Iq3g5jEde/pub?gid=576368048&single=true&output=csv",
  "간증롱폼":            "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEjSJ3Of6V82_BFanugtMzXGxPJ_2KyGjKy8FxC_y8HhhmWsDpCpsG4vaCCAOtIi4lKc6Iq3g5jEde/pub?gid=546344483&single=true&output=csv",
  "간증롱폼(영어)":       "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEjSJ3Of6V82_BFanugtMzXGxPJ_2KyGjKy8FxC_y8HhhmWsDpCpsG4vaCCAOtIi4lKc6Iq3g5jEde/pub?gid=1323752071&single=true&output=csv",

let ALL_ROWS = [];

function statusClass(v){
  if(!v) return "todo";
  if(v.includes("완료")) return "done";
  if(v.includes("진행")) return "wip";
  return "todo";
}

/* 구글드라이브 공유 링크 -> 이미지 직접표시 URL로 변환 */
function normalizeImageUrl(url){
  if(!url) return "";
  const m = url.match(/[-\w]{25,}/); // drive file id 패턴 추출
  if(url.includes("drive.google.com") && m){
    return `https://drive.google.com/thumbnail?id=${m[0]}&sz=w400`;
  }
  return url;
}

/* 구글드라이브 공유 링크 -> zip 등 파일 직접 다운로드 URL로 변환 */
function normalizeDownloadUrl(url){
  if(!url) return "";
  const m = url.match(/[-\w]{25,}/);
  if(url.includes("drive.google.com") && m){
    return `https://drive.google.com/uc?export=download&id=${m[0]}`;
  }
  return url;
}

/* 라이트박스: 썸네일 클릭 시 확대 */
function openLightbox(url){
  if(!url) return;
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxImg").src = "";
}

/* 제작여부 필터 옵션을 현재 불러온 데이터 기준으로 다시 그림 */
function renderStatusOptions(rows){
  const statusSel = document.getElementById("filterStatus");
  statusSel.innerHTML = `<option value="">전체 제작여부</option><option value="미착수">미착수</option>`;
  const statuses = [...new Set(rows.map(r=>r["제작여부"]).filter(Boolean))];
  statuses.forEach(s=>{
    const o=document.createElement("option"); o.value=s; o.textContent=s;
    statusSel.appendChild(o);
  });
}

function renderPrompt(){
  const list = document.getElementById("list");
  list.innerHTML = `<div class="empty">☝️ 위에서 폼 종류를 선택해주세요.</div>`;
  document.getElementById("countText").textContent = "대기 중";
}

function renderLoading(){
  const list = document.getElementById("list");
  list.innerHTML = `<div class="empty">불러오는 중...</div>`;
  document.getElementById("countText").textContent = "";
}

/* 검색어 / 제작여부만 로컬 필터링 (폼종류는 이미 해당 시트만 불러왔으므로 다시 거를 필요 없음) */
function applyLocalFilters(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const status = document.getElementById("filterStatus").value;

  let rows = ALL_ROWS.filter(r=>{
    const matchQ = !q || (r["제목"]||"").toLowerCase().includes(q);
    const matchStatus = !status || r["제작여부"] === status || (status === "미착수" && !r["제작여부"]);
    return matchQ && matchStatus;
  });

  rows.sort((a,b)=> (parseInt(b["순번"])||0) - (parseInt(a["순번"])||0));
  renderList(rows);
}

/* 폼종류 선택 시 호출: 해당 폼종류에 연결된 시트를 불러옴 */
function loadForType(type){
  const url = SHEET_URLS[type];

  if(!url){
    ALL_ROWS = [];
    document.getElementById("list").innerHTML =
      `<div class="empty">"${type}"은(는) 아직 시트가 연결되지 않았습니다.<br>SHEET_URLS 설정에 이 폼종류의 CSV 주소를 넣어주세요.</div>`;
    document.getElementById("countText").textContent = "시트 미연결";
    document.getElementById("sourceText").textContent = "";
    renderStatusOptions([]);
    return;
  }

  renderLoading();
  Papa.parse(url, {
    download:true,
    header:true,
    skipEmptyLines:true,
    complete: (res)=>{
      ALL_ROWS = res.data;
      document.getElementById("sourceText").textContent = "구글시트 연동됨 · " + type;
      renderStatusOptions(ALL_ROWS);
      applyLocalFilters();
    },
    error: (err)=>{
      document.getElementById("list").innerHTML =
        `<div class="error">"${type}" 시트를 불러오지 못했습니다.<br>URL이 올바른지, "웹에 게시"가 되어있는지 확인해주세요.<code>${err.message||err}</code></div>`;
      document.getElementById("countText").textContent = "오류";
    }
  });
}

renderPrompt();
document.getElementById("searchInput").addEventListener("input", applyLocalFilters);
document.getElementById("filterStatus").addEventListener("change", applyLocalFilters);
document.getElementById("filterType").addEventListener("change", (e)=>{
  loadForType(e.target.value);
});
</script>
